<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Reels Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; z-index: 1; }
        #ui { position: absolute; z-index: 2; color: #fff; text-align: center; width: 100%; top: 20px; }
        .btn { background: #ff007f; border: none; padding: 15px 30px; color: #fff; font-size: 18px; border-radius: 30px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">
        <h1>Смотри Reels - Получай Награды</h1>
        <button class="btn" id="watchBtn">Смотреть Видео</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const geometry = new THREE.SphereGeometry(1, 32, 32);
        const material = new THREE.MeshBasicMaterial({ color: 0x0077ff, wireframe: true });
        const earth = new THREE.Mesh(geometry, material);
        scene.add(earth);

        camera.position.z = 2.5;

        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        document.getElementById('watchBtn').addEventListener('click', () => {
            alert('Запуск рекламного ролика...');
        });
    </script>
</body>
</html>

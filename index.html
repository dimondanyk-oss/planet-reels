<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Earth Ecosystem & Wallet</title>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #030712;
            color: #f3f4f6;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI Layer */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Header / Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 16px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #38bdf8;
        }

        nav {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #9ca3af;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .nav-btn:hover, .nav-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* Content Overlay / Modals */
        .content-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 28px;
            width: 90%;
            max-width: 500px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .content-panel.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #f8fafc;
        }

        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .close-btn:hover { color: #fff; }

        /* Wallet Section */
        .wallet-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .balance-label { font-size: 0.85rem; color: #94a3b8; margin-bottom: 4px; }
        .balance-val { font-size: 2rem; font-weight: 700; color: #38bdf8; }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .action-btn {
            background: #0284c7;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .action-btn:hover { background: #0369a1; }
        .action-btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .action-btn.secondary:hover { background: rgba(255, 255, 255, 0.1); }

        /* Tariffs Section */
        .tariffs-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tariff-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.2s;
        }

        .tariff-card:hover {
            border-color: #38bdf8;
        }

        .tariff-info h4 { color: #f3f4f6; margin-bottom: 2px; }
        .tariff-info p { font-size: 0.8rem; color: #9ca3af; }
        .tariff-price { font-weight: 700; color: #38bdf8; font-size: 1.1rem; }

        /* Footer Info */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-layer">
        <header class="interactive">
            <div class="logo">
                <i class="fa-solid me-2 fa-globe"></i> EARTH CORE
            </div>
            <nav>
                <button class="nav-btn active" onclick="switchTab('main')"><i class="fa-solid fa-house"></i> Главная</button>
                <button class="nav-btn" onclick="switchTab('tariffs')"><i class="fa-solid fa-layer-group"></i> Тарифы</button>
                <button class="nav-btn" onclick="switchTab('wallet')"><i class="fa-solid fa-wallet"></i> Кошелек</button>
            </nav>
        </header>

        <!-- Wallet Panel -->
        <div id="panel-wallet" class="content-panel interactive">
            <div class="panel-header">
                <div class="panel-title"><i class="fa-solid fa-wallet"></i> Мой Кошелек</div>
                <button class="close-btn" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="wallet-card">
                <div class="balance-label">Баланс аккаунта</div>
                <div class="balance-val" id="balance-amount">$1,250.00</div>
            </div>
            <div class="action-grid">
                <button class="action-btn" onclick="addFunds()"><i class="fa-solid fa-plus"></i> Пополнить</button>
                <button class="action-btn secondary" onclick="withdrawFunds()"><i class="fa-solid fa-arrow-up-right-from-square"></i> Вывести</button>
            </div>
        </div>

        <!-- Tariffs Panel -->
        <div id="panel-tariffs" class="content-panel interactive">
            <div class="panel-header">
                <div class="panel-title"><i class="fa-solid fa-layer-group"></i> Тарифные планы</div>
                <button class="close-btn" onclick="closePanels()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="tariffs-list">
                <div class="tariff-card">
                    <div class="tariff-info">
                        <h4>Базовый</h4>
                        <p>Доступ к стандартной орбите</p>
                    </div>
                    <div class="tariff-price">$10/мес</div>
                    <button class="action-btn secondary" onclick="selectTariff('Базовый')">Выбрать</button>
                </div>
                <div class="tariff-card">
                    <div class="tariff-info">
                        <h4>Продвинутый</h4>
                        <p>Высокая скорость обработки</p>
                    </div>
                    <div class="tariff-price">$29/мес</div>
                    <button class="action-btn" onclick="selectTariff('Продвинутый')">Выбрать</button>
                </div>
                <div class="tariff-card">
                    <div class="tariff-info">
                        <h4>VIP Экосистема</h4>
                        <p>Полный приоритетный доступ</p>
                    </div>
                    <div class="tariff-price">$99/мес</div>
                    <button class="action-btn secondary" onclick="selectTariff('VIP')">Выбрать</button>
                </div>
            </div>
        </div>

        <footer class="interactive">
            <div class="status-badge">
                <div class="status-dot"></div> Сеть активна
            </div>
            <div>3D Engine: Three.js</div>
        </footer>
    </div>

    <script>
        // --- UI Logic ---
        let currentBalance = 1250.00;

        function switchTab(tabName) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            closePanels();

            if (tabName === 'wallet') {
                document.getElementById('panel-wallet').classList.add('active');
                event.currentTarget.classList.add('active');
            } else if (tabName === 'tariffs') {
                document.getElementById('panel-tariffs').classList.add('active');
                event.currentTarget.classList.add('active');
            } else {
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
            }
        }

        function closePanels() {
            document.querySelectorAll('.content-panel').forEach(panel => panel.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.nav-btn')[0].classList.add('active');
        }

        function addFunds() {
            currentBalance += 100;
            document.getElementById('balance-amount').innerText = `$${currentBalance.toFixed(2)}`;
        }

        function withdrawFunds() {
            if (currentBalance >= 50) {
                currentBalance -= 50;
                document.getElementById('balance-amount').innerText = `$${currentBalance.toFixed(2)}`;
            } else {
                alert('Недостаточно средств!');
            }
        }

        function selectTariff(name) {
            alert(`Вы выбрали тариф: ${name}`);
            closePanels();
        }

        // --- Three.js Procedural 3D Earth ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false;

        // Procedural Texture Generator for Earth
        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#0284c7';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0f172a';
            for (let i = 0; i < 800; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = Math.random() * 20 + 5;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            return new THREE.CanvasTexture(canvas);
        }

        // Earth Sphere
        const geometry = new THREE.SphereGeometry(1.5, 64, 64);
        const material = new THREE.MeshPhongMaterial({
            map: createEarthTexture(),
            wireframe: false,
            shininess: 25
        });
        const earth = new THREE.Mesh(geometry, material);
        scene.add(earth);

        // Atmosphere Glow
        const atmosphereGeo = new THREE.SphereGeometry(1.55, 64, 64);
        const atmosphereMat = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.15,
            wireframe: true
        });
        const atmosphere = new THREE.Mesh(atmosphereGeo, atmosphereMat);
        scene.add(atmosphere);

        // Orbital Ring
        const ringGeo = new THREE.RingGeometry(2.0, 2.02, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);

        // Starfield Particles
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 1200;
        const starPositions = new Float32Array(starsCount * 3);

        for(let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 20;
        }

        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.02 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            earth.rotation.y += 0.002;
            atmosphere.rotation.y += 0.002;
            ring.rotation.z -= 0.001;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
